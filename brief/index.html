<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2A1C0A">
<title>Daily brief</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#2A1C0A;}
body{font-family:system-ui,sans-serif;color:#F4EFE4;-webkit-tap-highlight-color:transparent;}

#nav{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  background:rgba(42,28,10,.95);
  border-bottom:1px solid rgba(244,239,228,.1);
  position:sticky;top:0;z-index:10;
}
#nav a{
  display:flex;align-items:center;gap:6px;
  color:#F4EFE4;opacity:.6;text-decoration:none;font-size:13px;
  transition:opacity .15s;
}
#nav a:hover{opacity:1;}
#nav a svg{width:16px;height:16px;}
#nav h1{font-size:14px;font-weight:500;opacity:.9;}

#frame{
  display:block;width:100%;
  height:calc(100vh - 49px);height:calc(100dvh - 49px);
  border:none;
}

#placeholder{
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  height:calc(100vh - 49px);height:calc(100dvh - 49px);
  gap:12px;text-align:center;padding:0 32px;
}
#placeholder p{font-size:14px;opacity:.5;line-height:1.6;}
</style>
</head>
<body>

<div id="nav">
  <a href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>
  <h1>Daily brief</h1>
</div>

<iframe id="frame" title="Daily brief" hidden></iframe>
<div id="placeholder">
  <p>No brief available yet.<br>The next one will appear after the weekday evening run.</p>
</div>

<script>
fetch('latest.html')
  .then(r => { if (!r.ok) throw new Error(); return r.blob(); })
  .then(blob => {
    document.getElementById('frame').src = URL.createObjectURL(blob);
    document.getElementById('frame').hidden = false;
  })
  .catch(() => {
    document.getElementById('placeholder').style.display = 'flex';
  });
</script>
</body>
</html>
