<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111828">
<title>Week in review</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#111828;}
body{font-family:system-ui,sans-serif;color:#F4EFE4;-webkit-tap-highlight-color:transparent;}

#nav{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  background:rgba(17,24,40,.95);
  border-bottom:1px solid rgba(244,239,228,.1);
  position:sticky;top:0;z-index:10;
}
#nav a{
  display:flex;align-items:center;gap:6px;
  color:#F4EFE4;opacity:.6;text-decoration:none;font-size:13px;
  transition:opacity .15s;
}
#nav a:hover{opacity:1;}
#nav a svg{width:16px;height:16px;}
#nav h1{font-size:14px;font-weight:500;opacity:.9;}

/* password gate */
#gate{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:calc(100vh - 49px);height:calc(100dvh - 49px);
  gap:20px;padding:0 32px;
}
.lock-ring{
  width:52px;height:52px;border-radius:50%;
  background:rgba(143,184,232,.12);
  display:flex;align-items:center;justify-content:center;
}
.lock-ring svg{width:22px;height:22px;color:#8FB8E8;}
#gate h2{font-size:17px;font-weight:500;opacity:.9;}
#gate p{font-size:13px;opacity:.45;text-align:center;max-width:26ch;line-height:1.5;}

#pw-form{display:flex;gap:8px;width:100%;max-width:280px;}
#pw-input{
  flex:1;background:rgba(244,239,228,.08);border:1px solid rgba(244,239,228,.15);
  border-radius:8px;padding:10px 14px;color:#F4EFE4;font-size:15px;
  outline:none;font-family:inherit;
}
#pw-input:focus{border-color:rgba(143,184,232,.5);}
#pw-btn{
  background:#8FB8E8;color:#111828;border:none;border-radius:8px;
  padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;white-space:nowrap;
}
#pw-error{font-size:13px;color:#E8736A;display:none;}

/* content */
#frame{
  display:block;width:100%;
  height:calc(100vh - 49px);height:calc(100dvh - 49px);
  border:none;
}
#placeholder{
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  height:calc(100vh - 49px);height:calc(100dvh - 49px);
  gap:12px;text-align:center;padding:0 32px;
}
#placeholder p{font-size:14px;opacity:.5;line-height:1.6;}
</style>
</head>
<body>

<div id="nav">
  <a href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>
  <h1>Week in review</h1>
</div>

<div id="gate">
  <div class="lock-ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <h2>Portfolio report</h2>
  <p>Enter your password to view.</p>
  <form id="pw-form" onsubmit="return false;">
    <input id="pw-input" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button id="pw-btn" type="submit">Unlock</button>
  </form>
  <p id="pw-error">Incorrect password.</p>
</div>

<iframe id="frame" title="Week in review" hidden></iframe>
<div id="placeholder" hidden></div>

<script>
const HASH = '7af558e08b0fdeacf2dbd4ba70e61422535cce0e8845fcc4fbdf51f8c6b33f4c';
const SESSION_KEY = 'review_unlocked';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function showContent() {
  document.getElementById('gate').hidden = true;
  fetch('latest.html')
    .then(r => { if (!r.ok) throw new Error(); return r.blob(); })
    .then(blob => {
      document.getElementById('frame').src = URL.createObjectURL(blob);
      document.getElementById('frame').hidden = false;
    })
    .catch(() => {
      const p = document.getElementById('placeholder');
      p.style.display = 'flex';
      p.innerHTML = '<p>No review available yet.<br>The next one will appear after the Saturday morning run.</p>';
    });
}

// check session — skip gate if already unlocked this session
if (sessionStorage.getItem(SESSION_KEY) === '1') showContent();

document.getElementById('pw-form').addEventListener('submit', async () => {
  const val = document.getElementById('pw-input').value;
  const hash = await sha256(val);
  if (hash === HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    showContent();
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
});

document.getElementById('pw-input').addEventListener('input', () => {
  document.getElementById('pw-error').style.display = 'none';
});
</script>
</body>
</html>
